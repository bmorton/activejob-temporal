name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
        gemfile: [rails_7.2, rails_8.0, rails_8.1]
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.gemfile }}.gemfile
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"
      - name: Start Temporal dev server
        run: temporal server start-dev --headless --port 7233 &
      - name: Wait for dev server
        run: |
          for i in $(seq 1 30); do
            temporal operator cluster health --address localhost:7233 && exit 0
            sleep 1
          done
          echo "Temporal dev server did not become healthy" && exit 1
      - name: Run tests
        run: bundle exec rake spec
